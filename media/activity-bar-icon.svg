<svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <mask id="eye-mask">
      <!-- Base mask is white (keep) -->
      <rect width="24" height="24" fill="white" />
      <!-- Cut out the central white circle -->
      <circle cx="12" cy="12" r="3.25" fill="black" />
      <!-- Cut out the horizontal slit inside the eye -->
      <rect x="7.8" y="11.25" width="8.4" height="1.5" fill="black" rx="0.3" />
    </mask>
  </defs>

  <!-- 4 Outer Framing Corners -->
  <path d="M 1,7 V 1 H 7 V 2.5 H 2.5 V 7 Z" />
  <path d="M 23,7 V 1 H 17 V 2.5 H 21.5 V 7 Z" />
  <path d="M 1,17 V 23 H 7 V 21.5 H 2.5 V 17 Z" />
  <path d="M 23,17 V 23 H 17 V 21.5 H 21.5 V 17 Z" />

  <!-- Masked group for the interconnected nodes and eye -->
  <g mask="url(#eye-mask)">
    <!-- Left Dot -->
    <circle cx="4.5" cy="12" r="1.5" />
    <!-- Connecting Horizontal Line -->
    <rect x="4.5" y="11.25" width="15" height="1.5" />
    <!-- Right Dot -->
    <circle cx="19.5" cy="12" r="1.5" />
    
    <!-- Solid Eye Almond -->
    <path d="M 7,12 Q 12,4.5 17,12 Q 12,19.5 7,12 Z" />
  </g>

  <!-- Central Pupil (Drawn outside mask so it isn't cut out) -->
  <circle cx="12" cy="12" r="1.5" />
</svg>
